<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>슝 디버깅</title>
<meta name="description" content="탈 때 실제 도착 · 출발을 남기고 캡처를 올리는 슝 정확도 기록(주인만)">
<link rel="icon" href="/brand/favicon.ico" sizes="48x48">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<script>
  // 지도와 같은 테마(localStorage subway-theme: auto | light | dark)
  (() => { let c = 'auto'; try { c = localStorage.getItem('subway-theme') || 'auto'; } catch {}
    document.documentElement.dataset.theme = c === 'dark' || (c === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'; })();
</script>
<style>
:root{
  --syung:#ffd400;--syung-ink:#141414;--board:#fbfaf4;--paper:#fffdf6;--ink:#1d1f21;--secondary:#5d5a4e;--muted:#7d796a;--rule:#ece6cf;--control:#f5f1e1;
  --good:#1f8f55;--good-soft:#e3f4ea;--bad:#b3261e;--bad-soft:#fbe6e3;--shadow:0 3px 0 rgba(20,20,20,.05),0 8px 22px rgba(60,50,0,.08);
  --round:"Jua","Noto Sans KR","Apple SD Gothic Neo",sans-serif;
}
html[data-theme=dark]{--board:#131416;--paper:#1c1e21;--ink:#f1efe6;--secondary:#b9b5a6;--muted:#8f8b7d;--rule:#2d2f33;--control:#25272b;
  --good:#5fd394;--good-soft:#16301f;--bad:#f28b82;--bad-soft:#3a1d1a;--shadow:0 8px 22px rgba(0,0,0,.4)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--board);color:var(--ink);font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
.mast{background:var(--syung);color:var(--syung-ink);padding-top:env(safe-area-inset-top)}
html[data-theme=dark] .mast{background:#1b1c1f;color:var(--syung);box-shadow:0 2px 0 rgba(255,212,0,.35)}
.mast-in{max-width:960px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;gap:10px}
.mast h1{margin:0;font-family:var(--round);font-weight:400;font-size:22px}
.mast .sp{flex:1}
.mast a,.mast button{border:0;font-family:inherit;cursor:pointer;color:inherit;font-size:13px;font-weight:700;text-decoration:none;padding:7px 12px;border-radius:999px;background:rgba(20,20,20,.08)}
.mast a.on{background:var(--syung-ink);color:var(--syung)}
html[data-theme=dark] .mast a.on{background:var(--syung);color:var(--syung-ink)}
@media (max-width:400px){.mast-in{gap:6px}.mast h1{font-size:19px}.mast a,.mast button{padding:7px 10px}}
nav.tabs{max-width:960px;margin:12px auto 0;padding:0 16px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
nav.tabs button{height:40px;border:0;border-radius:12px;background:var(--control);color:var(--secondary);font:700 14px inherit;cursor:pointer}
nav.tabs button[aria-selected=true]{background:var(--ink);color:var(--board)}
main{max-width:960px;margin:0 auto;padding:14px 16px calc(48px + env(safe-area-inset-bottom));display:grid;gap:14px}
.box{background:var(--paper);border-radius:20px;box-shadow:var(--shadow);padding:18px}
h2{margin:0 0 10px;font-family:var(--round);font-weight:400;font-size:19px}
p{margin:0}
.muted{color:var(--muted);font-size:13px;line-height:1.55}
label{display:block;font-weight:700;font-size:13px;margin:12px 0 6px;color:var(--secondary)}
input,select,textarea{width:100%;font:16px inherit;color:var(--ink);background:var(--control);border:1px solid var(--rule);border-radius:12px;padding:11px 12px}
textarea{min-height:80px;resize:vertical}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--control);border-radius:14px;padding:4px}
.seg button{height:42px;border:0;border-radius:11px;background:transparent;color:var(--secondary);font:700 15px inherit;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;border:0;border-radius:16px;background:var(--syung);color:var(--syung-ink);font:400 20px var(--round);cursor:pointer;margin-top:14px}
.btn.ghost{background:var(--control);color:var(--ink);font:700 15px inherit;min-height:44px}
.btn.huge{min-height:96px;font-size:30px;border-radius:22px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chips button{border:1px solid var(--rule);background:var(--control);color:var(--ink);border-radius:999px;padding:9px 14px;font:700 15px inherit;cursor:pointer}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--board);border-color:var(--ink)}
.now{display:grid;gap:4px;text-align:center;padding:6px 0}
.now small{font-weight:700;color:var(--muted);font-size:13px}
.now b{font-family:var(--round);font-weight:400;font-size:34px;line-height:1.15}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.facts div{background:var(--control);border-radius:12px;padding:8px 10px;text-align:center}
.facts small{display:block;font-size:11px;color:var(--muted);font-weight:700}
.facts b{font-variant-numeric:tabular-nums;font-size:16px}
.log{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:4px;font-size:13px;color:var(--secondary);font-variant-numeric:tabular-nums}
.status{min-height:1.4em;font-size:14px;margin-top:10px}
.status.ok{color:var(--good)}.status.bad{color:var(--bad)}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.thumbs img,.thumbs span{width:84px;height:84px;object-fit:cover;border-radius:10px;border:1px solid var(--rule);display:grid;place-items:center;font-size:12px;color:var(--muted)}
.list{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.list li{background:var(--control);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.5}
.list small{color:var(--muted)}
.cmp{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px;font-variant-numeric:tabular-nums}
.cmp th{font-size:11px;color:var(--muted);font-weight:700;text-align:left;padding:4px 2px}
.cmp td{padding:4px 2px;border-top:1px solid var(--rule)}
.cmp td.d{color:var(--secondary)}
.motion-chart{min-width:0;margin:16px 0 0;padding-top:12px;border-top:1px solid var(--rule);color:var(--ink)}
.motion-chart__note{margin:0 0 12px;font-size:13px;line-height:1.6;color:var(--ink);word-break:keep-all;overflow-wrap:anywhere}
.motion-chart__svg{display:block;width:100%;max-width:640px;height:auto;background:var(--paper);font-family:inherit}
.motion-chart__heading{fill:var(--ink);font-size:13px;font-weight:700}
.motion-chart__event{font-size:12px;font-weight:600}
.motion-chart__graph-label{font-size:12px;font-weight:700;paint-order:stroke;stroke:var(--control);stroke-width:4px;stroke-linejoin:round}
.motion-chart__time{fill:var(--secondary);font-size:11px;font-variant-numeric:tabular-nums}
.motion-chart__empty-label{fill:var(--secondary);font-size:12px}
.motion-chart__detail,.motion-chart__empty{margin:8px 0 0;color:var(--secondary);font-size:12px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
.login{background:var(--bad-soft);color:var(--bad);border-radius:14px;padding:12px 14px;font-weight:700}
.login a{color:inherit}
[hidden]{display:none!important}
</style>
</head>
<body>
<header class="mast"><div class="mast-in"><h1>슝 디버깅</h1><span class="sp"></span><a href="/admin/learning">학습</a><a class="on" href="/admin/debug" aria-current="page">디버깅</a><form method="post" action="/api/logout" style="margin:0"><button type="submit">로그아웃</button></form></div></header>
<nav class="tabs" role="tablist">
  <button role="tab" id="tab-ride" aria-selected="true" aria-controls="ride">탑승 기록</button>
  <button role="tab" id="tab-shot" aria-selected="false" aria-controls="shot">캡처 올리기</button>
  <button role="tab" id="tab-list" aria-selected="false" aria-controls="list">올린 것</button>
</nav>
<main>
  <p class="login" id="login" hidden>로그인이 풀렸어요. <a href="/admin/login.html?next=%2Fadmin%2Fdebug">다시 로그인</a>하면 쌓아 둔 기록을 이어서 보내요.</p>

  <!-- 1. 탑승 기록 -->
  <section id="ride" role="tabpanel">
    <div class="box" id="setup">
      <h2>무엇을 타나요?</h2>
      <div class="seg"><button id="m-subway" aria-pressed="true">지하철</button><button id="m-bus" aria-pressed="false">버스</button></div>
      <div id="subway-setup">
        <label for="line">노선</label>
        <select id="line"></select>
        <label for="station">지금 탄 역</label>
        <div class="row"><input id="station" list="stations" placeholder="역 이름" autocomplete="off"><button class="btn ghost" id="near" style="margin:0;flex:0 0 auto;width:auto;padding:0 14px">가까운 역</button></div>
        <datalist id="stations"></datalist>
        <label for="train">열차 번호(모르면 비워 두세요)</label>
        <input id="train" inputmode="numeric" placeholder="예: 7123">
      </div>
      <div id="bus-setup" hidden>
        <label for="busno">버스 번호</label>
        <input id="busno" inputmode="text" placeholder="예: 3011" autocomplete="off">
        <div class="chips" id="busroutes"></div>
        <label for="vehicle">차량 번호(모르면 비워 두세요)</label>
        <input id="vehicle" placeholder="예: 서울70사1234 뒤 4자리">
      </div>
      <button class="btn" id="start" disabled>탑승 시작</button>
      <p class="muted" style="margin-top:10px">탑승 중에는 화면을 켜 두세요(GPS가 꺼지지 않게). 지하에서 끊겨도 기기에 쌓았다가 다시 연결되면 보내요.</p>
    </div>

    <div class="box" id="riding" hidden>
      <div class="now"><small id="ride-what"></small><b id="ride-where"></b><small id="ride-phase"></small></div>
      <div class="chips" id="nexts" hidden></div>
      <button class="btn huge" id="act"></button>
      <div class="row"><button class="btn ghost" id="mark">이상한 순간 표시</button><button class="btn ghost" id="undo">방금 것 취소</button></div>
      <div class="facts">
        <div><small>탄 지</small><b id="f-time">0:00</b></div>
        <div><small>GPS</small><b id="f-gps">-</b></div>
        <div><small>보낼 것</small><b id="f-queue">0</b></div>
        <div id="f-motion-box"><small>센서</small><b id="f-motion">-</b></div>
      </div>
      <ul class="log" id="log"></ul>
      <button class="btn ghost" id="end" style="margin-top:16px">내렸어요(끝내기)</button>
    </div>
  </section>

  <!-- 2. 캡처 올리기 -->
  <section id="shot" role="tabpanel" hidden>
    <div class="box">
      <h2>캡처 올리기</h2>
      <p class="muted">이상한 화면 · 동영상을 올려 주세요. 기기 정보와 지금 탑승 기록이 같이 붙어요.</p>
      <button class="btn" id="pick">캡처 고르기</button>
      <input id="files" type="file" accept="image/*,video/*" multiple hidden>
      <div class="thumbs" id="thumbs"></div>
      <label for="note">어떤 상황이었나요?</label>
      <textarea id="note" placeholder="예: 조선 모드, 11번 출구 장승, 갓이 깨져 보임 / 3011 탑승 중, 지도 버스가 내 위치보다 한 정류장 뒤"></textarea>
      <button class="btn" id="send" disabled>올리기</button>
      <div class="status" id="shot-status" role="status"></div>
    </div>
  </section>

  <!-- 3. 올린 것 -->
  <section id="list" role="tabpanel" hidden>
    <div class="box"><h2>오늘 탑승 기록</h2><ul class="list" id="rides"></ul></div>
    <div class="box"><h2>최근 캡처</h2><ul class="list" id="shots"></ul></div>
  </section>
</main>
<script>
'use strict';
// 디버깅 페이지(주인만, 2026-10-12 덕배): 탈 때 실제 도착 · 출발(정답)과 GPS 를 남기고, 캡처를 올린다.
// 기록은 기기(localStorage)에 먼저 쌓고 15초마다 /api/admin/debug/ride 로 보낸다 — 지하 · 터널에서 끊겨도 잃지 않게.
const $ = id => document.getElementById(id);
const store = {get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }};
const QUEUE = 'syung-debug-queue', RIDE = 'syung-debug-ride';
const fmt = t => new Date(t).toLocaleTimeString('ko-KR', {hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false});
const showLogin = on => { $('login').hidden = !on; };

// 탭
for (const [tab, panel] of [['tab-ride', 'ride'], ['tab-shot', 'shot'], ['tab-list', 'list']]) $(tab).onclick = () => {
  for (const [t, p] of [['tab-ride', 'ride'], ['tab-shot', 'shot'], ['tab-list', 'list']]) { $(t).setAttribute('aria-selected', t === tab); $(p).hidden = p !== panel; }
  if (panel === 'list') loadRecent();
};

// ---------- 보내기 줄 ----------
let queue = store.get(QUEUE, []), sending = false;
function push(event) {
  const e = {...event, ride: ride.id, mode: ride.mode, t: Date.now()};
  if (ride.mode === 'subway') Object.assign(e, {line: ride.line, train: ride.train || undefined});
  else Object.assign(e, {routeId: ride.routeId, routeName: ride.routeName, vehicle: ride.vehicle || undefined});
  if (gps.last && Date.now() - gps.last.t < 15000 && event.kind !== 'gps') Object.assign(e, {lat: gps.last.lat, lng: gps.last.lng, acc: gps.last.acc});
  queue.push(e); store.set(QUEUE, queue); $('f-queue').textContent = queue.length; return e;
}
async function flush() {
  if (sending || !queue.length || !navigator.onLine) return;
  sending = true;
  // 센서 묶음(약 3KB)은 한 번에 40개까지 — 본문 1MB 상한 안에
  const batch = []; let moves = 0;
  for (const e of queue) { if (batch.length >= 500 || (e.kind === 'motion' && ++moves > 40)) break; batch.push(e); }
  try {
    const r = await fetch('/api/admin/debug/ride', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({events: batch}), credentials: 'same-origin'});
    if (r.status === 401) showLogin(true);
    else if (r.ok || r.status === 400) { showLogin(false); queue = queue.slice(batch.length); store.set(QUEUE, queue); }   // 400: 고칠 수 없는 묶음은 버린다
  } catch {} finally { sending = false; $('f-queue').textContent = queue.length; }
}
setInterval(flush, 15000);
addEventListener('online', flush);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(); else if (ride.id) keepAwake(); });

// ---------- GPS · 화면 켜 두기 ----------
const gps = {watch: null, last: null, sentAt: 0, points: 0};
function startGps() {
  if (!navigator.geolocation || gps.watch != null) return;
  gps.watch = navigator.geolocation.watchPosition(p => {
    const c = p.coords; gps.last = {t: Date.now(), lat: c.latitude, lng: c.longitude, acc: c.accuracy};
    $('f-gps').textContent = `${Math.round(c.accuracy)}m`;
    if (ride.id && Date.now() - gps.sentAt >= 4500) {   // 5초에 한 점
      gps.sentAt = Date.now(); gps.points++;
      push({kind: 'gps', lat: c.latitude, lng: c.longitude, acc: c.accuracy, speed: c.speed ?? undefined, heading: Number.isFinite(c.heading) ? c.heading : undefined});
    }
  }, () => { $('f-gps').textContent = '없음'; }, {enableHighAccuracy: true, maximumAge: 2000, timeout: 20000});
}
function stopGps() { if (gps.watch != null) navigator.geolocation.clearWatch(gps.watch); gps.watch = null; }
let lock = null;
async function keepAwake() { try { lock = await navigator.wakeLock?.request('screen'); } catch {} }

// ---------- 가속도 센서: 0.1초 칸 평균을 5초마다 한 사건(motion)으로 — 누른 도착 · 출발과 센서가 잡은 섰다 · 떠났다를 맞춰 본다 ----------
// 칸마다 [사건 t 기준 ms, 중력 포함 가속 x y z, 중력 뺀 가속 x y z, 회전 α β γ](m/s², °/s, 없는 값 null). 화면이 꺼지면 브라우저가 센서를 멈춘다.
const motion = {on: false, bins: [], cur: null, samples: 0, since: 0};
const setMotion = text => { $('f-motion').textContent = text; };
async function startMotion() {
  if (motion.on || motion.asking) return;
  if (typeof DeviceMotionEvent === 'undefined') return setMotion('없음');
  motion.asking = true;
  try {   // 아이폰: 누르는 순간에만 물을 수 있다(탑승 시작 · 센서 칸)
    if (typeof DeviceMotionEvent.requestPermission === 'function' && await DeviceMotionEvent.requestPermission() !== 'granted') return setMotion('거부');
  } catch { return setMotion('눌러 켜기'); } finally { motion.asking = false; }
  motion.on = true; motion.since = Date.now(); motion.samples = 0; addEventListener('devicemotion', onMotion); setMotion('대기');
}
function stopMotion() { if (!motion.on) return; removeEventListener('devicemotion', onMotion); motion.on = false; sendMotion(true); setMotion('-'); }
function onMotion(e) {
  const slot = Math.floor(Date.now() / 100) * 100, g = e.accelerationIncludingGravity || {}, a = e.acceleration || {}, r = e.rotationRate || {};
  const v = [g.x, g.y, g.z, a.x, a.y, a.z, r.alpha, r.beta, r.gamma];
  if (!motion.cur || motion.cur.slot !== slot) { closeBin(); motion.cur = {slot, sum: v.map(() => 0), n: v.map(() => 0)}; }
  v.forEach((x, i) => { if (Number.isFinite(x)) { motion.cur.sum[i] += x; motion.cur.n[i]++; } });
  motion.samples++;
}
function closeBin() { const c = motion.cur; if (c) motion.bins.push([c.slot, ...c.sum.map((s, i) => c.n[i] ? Math.round(s / c.n[i] * 100) / 100 : null)]); motion.cur = null; }
function sendMotion(all = false) {
  if (all) closeBin();
  if (!ride.id || !motion.bins.length) return;
  // 한 사건에 140칸까지(서버 상한 150칸 = 1500개) — 넘는 묶음은 서버가 통째로 거절해 함께 보낸 도착 · 출발까지 버려진다
  const base = Date.now();
  for (let i = 0; i < motion.bins.length; i += 140) push({kind: 'motion', m: motion.bins.slice(i, i + 140).flatMap(([slot, ...v]) => [slot - base, ...v])});
  motion.bins = [];
  setMotion(`${Math.round(motion.samples / Math.max(1, (Date.now() - motion.since) / 1000))}Hz`);
}
setInterval(sendMotion, 5000);
$('f-motion-box').onclick = () => { if (ride.id) startMotion(); };

// ---------- 지하철 자료: 역(index.html 안의 stationData) · 노선 이웃(edge_times.json) ----------
let stations = new Map(), neighbors = new Map();   // id → 역, `${line}:${id}` → [이웃 id]
const lineStations = line => [...stations.values()].filter(s => neighbors.has(`${line}:${s.id}`)).sort((a, b) => a.name.localeCompare(b.name, 'ko'));
async function loadSubway() {
  const [html, edges] = await Promise.all([fetch('/index.html').then(r => r.text()), fetch('/edge_times.json').then(r => r.json())]);
  const doc = new DOMParser().parseFromString(html, 'text/html');
  for (const s of JSON.parse(doc.getElementById('stationData').textContent)) stations.set(s.id, s);
  const lines = new Set();
  for (const key of Object.keys(edges.edges)) {
    const [line, a, b] = key.split(':'); lines.add(line);
    for (const [x, y] of [[a, b], [b, a]]) { const k = `${line}:${x}`; if (!neighbors.has(k)) neighbors.set(k, []); if (!neighbors.get(k).includes(+y)) neighbors.get(k).push(+y); }
  }
  const order = [...lines].sort((a, b) => (parseInt(a) || 99) - (parseInt(b) || 99) || a.localeCompare(b, 'ko'));
  $('line').innerHTML = order.map(l => `<option>${l}</option>`).join('');
  $('line').value = store.get('syung-debug-line', order[0]) || order[0];
  fillStations(); check();
}
function fillStations() { $('stations').innerHTML = lineStations($('line').value).map(s => `<option value="${s.name}">`).join(''); }
const stationByName = (line, name) => lineStations(line).find(s => s.name === name.trim());
$('line').onchange = () => { store.set('syung-debug-line', $('line').value); fillStations(); check(); };
$('station').oninput = check;
$('near').onclick = () => navigator.geolocation?.getCurrentPosition(p => {
  const {latitude: la, longitude: lo} = p.coords, d = s => (s.lat - la) ** 2 + ((s.lon - lo) * Math.cos(la * Math.PI / 180)) ** 2;
  const best = lineStations($('line').value).sort((a, b) => d(a) - d(b))[0]; if (best) { $('station').value = best.name; check(); }
}, () => alert('GPS 를 못 받았어요(지하일 수 있어요). 역 이름을 직접 골라 주세요.'), {enableHighAccuracy: true, timeout: 10000});

// ---------- 버스: 번호 → 노선 ----------
let busPick = null, busTimer = null;
$('busno').oninput = () => { clearTimeout(busTimer); busTimer = setTimeout(findBus, 300); };
async function findBus() {
  const name = $('busno').value.trim(); busPick = null; check();
  if (!name) { $('busroutes').innerHTML = ''; return; }
  const r = await fetch(`/api/admin/debug/bus-route?name=${encodeURIComponent(name)}`, {credentials: 'same-origin'});
  if (r.status === 401) return showLogin(true);
  const {routes = []} = await r.json();
  $('busroutes').innerHTML = '';
  for (const route of routes) {
    const b = document.createElement('button'); b.textContent = `${route.name}${route.start ? ` · ${route.start}→${route.end}` : ''}`;
    b.setAttribute('aria-pressed', 'false');
    b.onclick = () => { busPick = route; for (const x of $('busroutes').children) x.setAttribute('aria-pressed', x === b); check(); };
    $('busroutes').append(b);
  }
  if (routes.length === 1) $('busroutes').firstChild.click();
}

// ---------- 탑승 ----------
let mode = 'subway';
const ride = store.get(RIDE, {});
function setMode(m) { mode = m; $('m-subway').setAttribute('aria-pressed', m === 'subway'); $('m-bus').setAttribute('aria-pressed', m === 'bus');
  $('subway-setup').hidden = m !== 'subway'; $('bus-setup').hidden = m !== 'bus'; check(); }
$('m-subway').onclick = () => setMode('subway'); $('m-bus').onclick = () => setMode('bus');
function check() { $('start').disabled = mode === 'subway' ? !stationByName($('line').value, $('station').value) : !busPick; }
const save = () => store.set(RIDE, ride);
const say = text => { const li = document.createElement('li'); li.textContent = `${fmt(Date.now())} ${text}`; $('log').prepend(li); };

$('start').onclick = () => {
  startMotion();   // 아이폰 센서 허락은 이 누름 안에서만 물을 수 있다
  Object.keys(ride).forEach(k => delete ride[k]);
  Object.assign(ride, {id: `${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`, mode, startedAt: Date.now(), moving: false});
  if (mode === 'subway') { const s = stationByName($('line').value, $('station').value);
    Object.assign(ride, {line: $('line').value, train: $('train').value.trim(), path: [s.id]}); push({kind: 'start', station: s.name}); }
  else { Object.assign(ride, {routeId: busPick.id, routeName: busPick.name, vehicle: $('vehicle').value.trim(), stops: 0}); push({kind: 'start'}); }

};
function enterRiding() {
  $('setup').hidden = true; $('riding').hidden = false; startGps(); keepAwake(); startMotion(); render();
  if (ride.mode === 'bus') { pollBus(); clearInterval(pollTimer); pollTimer = setInterval(pollBus, 30000); }
}
// 탄 노선을 서버가 '보는 중'으로 두어 원자료 위치가 30초마다 기록되게(정답과 맞춰 볼 자료)
function pollBus() { if (ride.mode === 'bus' && ride.routeId) fetch(`/api/bus/live?routes=${ride.routeId}&focus=${ride.routeId}`, {cache: 'no-store'}).catch(() => {}); }
let nextPick = null, pollTimer = null;
function render() {
  if (!ride.id) return;
  if (ride.mode === 'subway') {
    const at = ride.path.at(-1), here = stations.get(at), options = (neighbors.get(`${ride.line}:${at}`) || []).filter(id => id !== ride.path.at(-2));   // 지나온 역 쪽은 빼고
    if (!options.includes(nextPick)) nextPick = options[0] ?? null;
    $('ride-what').textContent = `${ride.line}${ride.train ? ` · ${ride.train}열차` : ''}`;
    $('ride-where').textContent = ride.moving ? `→ ${stations.get(nextPick)?.name || '?'}` : here?.name || '?';
    $('ride-phase').textContent = ride.moving ? `${here?.name || ''} 출발함 · 역에 서면 누르세요` : '역에 서 있음 · 문 닫고 출발하면 누르세요';
    $('nexts').hidden = !ride.moving || options.length < 2; $('nexts').innerHTML = '';
    for (const id of options) { const b = document.createElement('button'); b.textContent = stations.get(id)?.name; b.setAttribute('aria-pressed', id === nextPick);
      b.onclick = () => { nextPick = id; render(); }; $('nexts').append(b); }
    $('act').textContent = ride.moving ? `${stations.get(nextPick)?.name || '다음 역'} 도착` : '출발';
  } else {
    $('ride-what').textContent = `${ride.routeName}번${ride.vehicle ? ` · ${ride.vehicle}` : ''}`;
    $('ride-where').textContent = ride.moving ? '달리는 중' : '정류장에 섬';
    $('ride-phase').textContent = `정류장 ${ride.stops || 0}곳 · GPS 는 5초마다 저절로`;

}
$('act').onclick = () => {
  if (navigator.vibrate) navigator.vibrate(30);
  if (ride.mode === 'subway') {
    const here = stations.get(ride.path.at(-1))?.name;
    if (ride.moving) { const s = stations.get(nextPick); push({kind: 'arrive', station: s?.name}); ride.path.push(nextPick); ride.moving = false; say(`${s?.name} 도착`); }
    else { push({kind: 'depart', station: here}); ride.moving = true; say(`${here} 출발`); }
  } else {
    if (ride.moving) { ride.stops = (ride.stops || 0) + 1; push({kind: 'arrive'}); ride.moving = false; say('정류장 도착'); }
    else { push({kind: 'depart'}); ride.moving = true; say('출발'); }
  }
  save(); render(); flush();
};
$('mark').onclick = () => { const note = prompt('무엇이 이상했나요? (비워도 돼요)') ?? null; if (note === null) return; push({kind: 'mark', note}); say(`표시${note ? `: ${note}` : ''}`); flush(); };
$('undo').onclick = () => {
  // 아직 안 보낸 마지막 도착 · 출발만 거둔다(보낸 것은 표시로 바로잡기)
  const i = queue.findLastIndex(e => e.ride === ride.id && (e.kind === 'arrive' || e.kind === 'depart'));
  if (i < 0) { push({kind: 'mark', note: '바로 앞 도착 · 출발 취소'}); say('이미 보낸 것 — 취소 표시를 남겼어요'); }
  else { const e = queue.splice(i, 1)[0]; store.set(QUEUE, queue); $('f-queue').textContent = queue.length; say(`${e.kind === 'arrive' ? '도착' : '출발'} 취소`); }
  if (ride.mode === 'subway') { if (ride.moving) ride.moving = false; else if (ride.path.length > 1) { nextPick = ride.path.pop(); ride.moving = true; } }
  else ride.moving = !ride.moving;
  save(); render();
};
$('end').onclick = async () => {
  if (!confirm('탑승 기록을 끝낼까요?')) return;
  stopMotion(); push({kind: 'end'}); clearInterval(pollTimer); stopGps(); lock?.release?.().catch(() => {});
  Object.keys(ride).forEach(k => delete ride[k]); save(); await flush();
  $('riding').hidden = true; $('setup').hidden = false;
};
setInterval(() => { if (ride.id) { const s = Math.floor((Date.now() - ride.startedAt) / 1000); $('f-time').textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; } }, 1000);

$('pick').onclick = () => $('files').click();

const deviceState = () => ({ua: navigator.userAgent, w: innerWidth, h: innerHeight, dpr: devicePixelRatio, theme: document.documentElement.dataset.theme,
  ride: ride.id ? {id: ride.id, mode: ride.mode, line: ride.line || ride.routeName, at: ride.mode === 'subway' ? stations.get(ride.path.at(-1))?.name : undefined} : undefined,

// ---------- 올린 것 ----------
// 누른 도착 · 출발과 센서가 잡은 것(서버 ride_motion, 시험판)을 나란히: 누름마다 90초 안의 같은 종류 센서 사건 하나
function compareTable(x) {
  const used = new Set(), rows = [], sec = v => v == null ? '' : `${v > 0 ? '+' : ''}${v}초`;
  let stop = 0;
  for (const tap of x.taps || []) {
    let best = null; (x.sensor || []).forEach((e, i) => { if (!used.has(i) && e.kind === tap.kind && Math.abs(e.t - tap.t) <= 90000 && (best == null || Math.abs(e.t - tap.t) < Math.abs(x.sensor[best].t - tap.t))) best = i; });
    if (best != null) used.add(best);
    if (tap.kind === 'arrive') stop++;
    const where = tap.station || (x.mode === 'bus' ? (tap.kind === 'depart' && !stop ? '처음' : `정류장 ${stop}`) : '');
    rows.push({t: tap.t, where, kind: tap.kind, tap: tap.t, sensor: best != null ? x.sensor[best].t : null});
  }
  (x.sensor || []).forEach((e, i) => { if (!used.has(i)) rows.push({t: e.t, where: '(센서만)', kind: e.kind, tap: null, sensor: e.t}); });
  rows.sort((a, b) => a.t - b.t);
  const table = document.createElement('table'); table.className = 'cmp';
  table.innerHTML = '<thead><tr><th>역</th><th></th><th>누름</th><th>센서</th><th>차이</th></tr></thead>';
  const body = document.createElement('tbody');
  for (const r of rows) { const tr = document.createElement('tr');
    for (const [text, cls] of [[r.where, ''], [r.kind === 'arrive' ? '도착' : '출발', ''], [r.tap ? fmt(r.tap) : '—', ''], [r.sensor ? fmt(r.sensor) : (x.series ? '못 잡음' : '—'), ''],
      [r.tap && r.sensor ? sec(Math.round((r.sensor - r.tap) / 1000)) : '', 'd']]) { const td = document.createElement('td'); td.textContent = text; if (cls) td.className = cls; tr.append(td); }
    body.append(tr); }
  table.append(body); return table;
}
// 센서 그래프(Codex 디자인, 2026-10-12): 같은 시간축에 위 = 내가 누른 것, 가운데 = 힘(위로 솟음 출발 가속 · 아래로 꺼짐 브레이크), 아래 = 센서가 잡은 것
function motionChart(x) {
  const NS = 'http://www.w3.org/2000/svg';
  const box = document.createElement('figure');
  box.className = 'motion-chart';

  const note = document.createElement('figcaption');
  note.className = 'motion-chart__note';
  note.textContent = '위로 솟으면 출발 가속, 아래로 꺼지면 브레이크. 같은 세로 위치의 누름과 센서를 비교하세요.';
  box.append(note);

  // 누락되거나 잘못된 값은 그리지 않는다.
  const pts = (x.series || [])
    .filter(p => Array.isArray(p) && Number.isFinite(p[0]) && Number.isFinite(p[1]))
    .slice().sort((a, b) => a[0] - b[0]);

  const events = source => (source || [])
    .filter(e => Number.isFinite(e.t) && ['arrive', 'depart'].includes(e.kind))
    .slice().sort((a, b) => a.t - b.t);

  const taps = events(x.taps), sensors = events(x.sensor);
  const times = [
    x.from, x.to, ...pts.map(p => p[0]),
    ...taps.map(e => e.t), ...sensors.map(e => e.t)
  ].filter(Number.isFinite);

  if (!times.length) {
    const empty = document.createElement('p');
    empty.className = 'motion-chart__empty';
    empty.textContent = '비교할 기록이 없어요.';
    box.append(empty);
    return [box];
  }

  let t0 = Math.min(...times), t1 = Math.max(...times);
  if (t0 === t1) { t0 -= 1000; t1 += 1000; }

  const W = 320, left = 12, right = W - 12;
  const X = t => left + (t - t0) / (t1 - t0) * (right - left);
  const word = e => e.kind === 'depart' ? '출발' : '도착';
  const color = e => e.kind === 'depart' ? 'var(--good)' : 'var(--bad)';

  // 가까운 사건의 글자는 다른 줄에 놓되, 표시점은 실제 시각을 유지한다.
  function layout(list, stationNames) {
    const ends = [];
    const items = list.map(e => {
      const station = stationNames ? String(e.station || '') : '';
      const short = station.length > 7 ? `${station.slice(0, 6)}…` : station;
      const width = Math.max(44, short.length * 12 + 8);
      const px = X(e.t);
      const cx = Math.max(left + width / 2, Math.min(right - width / 2, px));
      const start = cx - width / 2;
      let row = ends.findIndex(end => end + 8 <= start);
      if (row < 0) row = ends.length;
      ends[row] = cx + width / 2;
      return {e, station, short, px, cx, row};
    });
    return {items, rows: Math.max(1, ends.length)};
  }

  const upper = layout(taps, true), lower = layout(sensors, false);
  const graphTop = 38 + upper.rows * 42;
  const graphH = 132, zero = graphTop + graphH / 2;
  const graphBottom = graphTop + graphH;
  const lowerTop = graphBottom + 32;
  const tickY = lowerTop + lower.rows * 42 + 16;
  const H = tickY + 14;

  // 모든 기록에서 ±1을 기본 범위로 써 작은 흔들림이 크게 보이지 않게 한다.
  const peak = Math.max(1, ...pts.map(p => Math.abs(p[1])));
  const Y = v => zero - v / peak * (graphH / 2 - 12);

  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.setAttribute('class', 'motion-chart__svg');
  svg.setAttribute('role', 'img');

  const add = (tag, attrs = {}, text, parent = svg) => {
    const node = document.createElementNS(NS, tag);
    for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
    if (text != null) node.textContent = text;
    parent.append(node);
    return node;
  };

  add('title', {}, '누른 시각과 센서가 감지한 시각 비교');
  add('desc', {}, [
    '위쪽은 내가 누른 기록, 가운데는 힘의 변화, 아래쪽은 센서 감지 기록입니다.',
    '위쪽 봉우리는 출발 가속, 아래쪽 골짜기는 브레이크입니다.',
    '가운데 선 근처는 서 있거나 일정한 속도로 달리는 상태로, 정차 여부를 힘만으로 구분할 수 없습니다.',
    ...taps.map(e => `누름: ${e.station || ''} ${word(e)} ${fmt(e.t)}.`),
    ...sensors.map(e => `센서: ${word(e)} ${fmt(e.t)}.`),
    !pts.length ? '힘 기록이 없습니다.' : ''
  ].join(' '));

  add('text', {x: left, y: 18, class: 'motion-chart__heading'}, '내가 누른 것');
  add('text', {x: left, y: graphBottom + 22, class: 'motion-chart__heading'}, '센서가 잡은 것');

  add('rect', {
    x: left, y: graphTop, width: right - left, height: graphH,
    fill: 'var(--control)', rx: 6
  });

  // 세 개의 시간 눈금을 모든 줄에 걸쳐 맞춘다.
  for (const [i, t] of [t0, (t0 + t1) / 2, t1].entries()) {
    const px = X(t);
    add('line', {
      x1: px, x2: px, y1: 26, y2: tickY - 14,
      stroke: 'var(--rule)', 'stroke-width': 1
    });
    add('text', {
      x: px, y: tickY, class: 'motion-chart__time',
      'text-anchor': i === 0 ? 'start' : i === 2 ? 'end' : 'middle'
    }, fmt(t));
  }

  add('line', {
    x1: left, x2: right, y1: zero, y2: zero,
    stroke: 'var(--secondary)', 'stroke-width': 1, 'stroke-dasharray': '3 4'
  });

  // 실선은 누름, 점선은 센서. 색 없이도 출처를 구분할 수 있다.
  for (const [list, sensor] of [[taps, false], [sensors, true]]) {
    for (const e of list) {
      add('line', {
        x1: X(e.t), x2: X(e.t), y1: graphTop, y2: graphBottom,
        stroke: 'var(--secondary)', opacity: .45,
        'stroke-width': 1, ...(sensor ? {'stroke-dasharray': '3 4'} : {})
      });
    }
  }

  // 0을 지나는 지점을 끼워 넣어 가속과 브레이크의 색을 정확히 나눈다.
  // 긴 수집 공백은 연결하지 않는다.
  const runs = [];
  let run = [];
  for (const p of pts) {
    const prev = run.at(-1);
    if (prev && p[0] - prev[0] > 5000) {
      runs.push(run);
      run = [];
    } else if (prev && prev[1] * p[1] < 0) {
      const ratio = Math.abs(prev[1]) / (Math.abs(prev[1]) + Math.abs(p[1]));
      run.push([prev[0] + (p[0] - prev[0]) * ratio, 0]);
    }
    run.push(p);
  }
  if (run.length) runs.push(run);

  for (const points of runs) {
    if (points.length === 1) {
      add('circle', {
        cx: X(points[0][0]), cy: Y(points[0][1]), r: 2,
        fill: points[0][1] >= 0 ? 'var(--good)' : 'var(--bad)'
      });
      continue;
    }
    for (const positive of [true, false]) {
      const coords = points.map(([t, v]) =>
        `${X(t).toFixed(2)},${Y(positive ? Math.max(0, v) : Math.min(0, v)).toFixed(2)}`
      );
      const stroke = positive ? 'var(--good)' : 'var(--bad)';
      add('path', {
        d: `M ${X(points[0][0])},${zero} L ${coords.join(' L ')} L ${X(points.at(-1)[0])},${zero} Z`,
        fill: stroke, 'fill-opacity': .14
      });
      add('polyline', {
        points: coords.join(' '), fill: 'none', stroke,
        'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round'
      });
    }
  }

  // 가운데 선을 마지막에 다시 그려 색이 있는 바닥선이 두드러지지 않게 한다.
  add('line', {
    x1: left, x2: right, y1: zero, y2: zero,
    stroke: 'var(--secondary)', 'stroke-width': 1, 'stroke-dasharray': '3 4'
  });

  for (const [label, y, fill] of [
    ['출발 가속 ↑', graphTop + 18, 'var(--good)'],
    ['브레이크 ↓', graphBottom - 10, 'var(--bad)']
  ]) {
    add('text', {x: left + 8, y, fill, class: 'motion-chart__graph-label'}, label);
  }

  // 누름과 센서의 글자를 표시점에 연결한다.
  function drawLane(lane, sensor) {
    if (!lane.items.length) {
      add('text', {
        x: left, y: sensor ? lowerTop + 16 : 49,
        class: 'motion-chart__empty-label'
      }, sensor ? '감지한 사건 없음' : '누른 기록 없음');
      return;
    }

    for (const {e, station, short, px, cx, row} of lane.items) {
      const y = sensor ? lowerTop + row * 42 + 14 : 42 + row * 42;
      const dotY = sensor ? graphBottom + 7 : graphTop - 7;
      const labelEdge = sensor ? y - 12 : y + (short ? 19 : 4);
      const group = add('g');
      add('title', {}, `${station ? `${station} · ` : ''}${word(e)} ${fmt(e.t)}`, group);
      add('path', {
        d: `M ${cx},${labelEdge} L ${px},${dotY}`,
        fill: 'none', stroke: 'var(--secondary)', 'stroke-width': 1,
        ...(sensor ? {'stroke-dasharray': '3 3'} : {})
      }, null, group);

      // 누름은 채운 원, 센서는 빈 원으로 구분한다.
      add('circle', {
        cx: px, cy: dotY, r: 3.5,
        fill: sensor ? 'var(--paper)' : 'var(--ink)',
        stroke: 'var(--ink)', 'stroke-width': 1.5
      }, null, group);
      add('text', {
        x: cx, y, 'text-anchor': 'middle',
        fill: short ? 'var(--ink)' : color(e),
        class: 'motion-chart__event'
      }, short || word(e), group);
      if (short) {
        add('text', {
          x: cx, y: y + 16, 'text-anchor': 'middle',
          fill: color(e), class: 'motion-chart__event'
        }, word(e), group);
      }
    }
  }

  drawLane(upper, false);
  drawLane(lower, true);
  box.append(svg);

  const detail = document.createElement('p');
  detail.className = 'motion-chart__detail';
  detail.textContent = pts.length
    ? '가운데 선 근처 = 서 있거나 일정하게 달림 · 센서의 도착 표시는 추정이에요.'
    : '힘 기록이 없어 누름과 센서가 잡은 시각만 표시했어요.';
  box.append(detail);
  return [box];
}
async function loadRecent() {
  const r = await fetch('/api/admin/debug/recent', {credentials: 'same-origin'});
  if (r.status === 401) return showLogin(true);
  const {rides = [], shots = []} = await r.json();
  $('rides').innerHTML = rides.length ? '' : '<li class="muted">오늘은 아직 없어요.</li>';
  for (const x of rides) { const li = document.createElement('li');
    li.innerHTML = `<b></b><br><small></small>`; li.querySelector('b').textContent = `${x.mode === 'bus' ? '버스' : '지하철'} ${x.line || ''}`;
    li.querySelector('small').textContent = `${fmt(x.from)}~${fmt(x.to)} · 도착 ${x.stops}번 · GPS ${x.gps}점${x.series ? ' · 센서 있음' : ''}`;
    if ((x.taps || []).length || (x.sensor || []).length) li.append(compareTable(x));
    if ((x.series || []).length) li.append(...motionChart(x));
    $('rides').append(li); }
  $('shots').innerHTML = shots.length ? '' : '<li class="muted">아직 없어요.</li>';
  for (const s of shots) { const li = document.createElement('li');
    li.innerHTML = `<b></b><br><small></small>`; li.querySelector('b').textContent = s.note || '(메모 없음)';
    li.querySelector('small').textContent = `${new Date(s.at).toLocaleString('ko-KR')} · ${s.type} · ${Math.round(s.bytes / 1024)}KB`; $('shots').append(li); }
}

// 시작: 지하철 자료 · 하던 탑승 이어서
$('f-queue').textContent = queue.length;
loadSubway().then(() => { if (ride.id) { $('log').innerHTML = ''; say('하던 탑승 이어서'); enterRiding(); } }).catch(() => { $('line').innerHTML = '<option>역 자료를 못 받았어요</option>'; });
fetch('/api/admin/debug/recent', {credentials: 'same-origin'}).then(r => showLogin(r.status === 401)).catch(() => {});
flush();
</script>
