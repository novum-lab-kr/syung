<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>슝 서버 상태</title>
<link rel="icon" href="/brand/favicon.ico" sizes="48x48">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<script>
  // 지도와 같은 테마 선택(localStorage subway-theme: auto | light | dark)
  (() => { let c = 'auto'; try { c = localStorage.getItem('subway-theme') || 'auto'; } catch {}
    document.documentElement.dataset.theme = c === 'dark' || (c === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'; })();
</script>
<style>
:root{
  --syung:#ffd400;--syung-deep:#c79a00;--syung-soft:#fff6c2;--syung-ink:#141414;
  --board:#fbfaf4;--paper:#fffdf6;--ink:#1d1f21;--secondary:#5d5a4e;--muted:#7d796a;--rule:#ece6cf;--control:#f5f1e1;
  --good:#1f8f55;--good-soft:#e3f4ea;--bad:#c0392b;--bad-soft:#fbe6e3;--mid:#b07a00;--mid-soft:#fdf1cc;
  --shadow:0 3px 0 rgba(20,20,20,.05),0 8px 22px rgba(60,50,0,.08);
  --round:"Jua","Noto Sans KR","Apple SD Gothic Neo",sans-serif;
}
html[data-theme=dark]{
  --board:#131416;--paper:#1c1e21;--ink:#f1efe6;--secondary:#b9b5a6;--muted:#8f8b7d;--rule:#2d2f33;--control:#25272b;
  --syung-deep:#ffd400;--syung-soft:#2e2a14;
  --good:#5fd394;--good-soft:#16301f;--bad:#ff7b6b;--bad-soft:#3a1d1a;--mid:#ffcf4a;--mid-soft:#332a10;
  --shadow:0 8px 22px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--board);color:var(--ink);font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
.mast{background:var(--syung);color:var(--syung-ink);padding-top:env(safe-area-inset-top)}
html[data-theme=dark] .mast{background:#1b1c1f;color:var(--syung);box-shadow:0 2px 0 rgba(255,212,0,.35)}
.mast-in{max-width:960px;margin:0 auto;padding:14px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.mast h1{margin:0;font-family:var(--round);font-weight:400;font-size:22px}
.mast .sp{flex:1}
.mast nav{display:flex;flex-wrap:wrap;gap:6px}
.mast a,.mast button{border:0;font-family:inherit;cursor:pointer;color:inherit;font-size:13px;font-weight:700;text-decoration:none;padding:7px 12px;border-radius:999px;background:rgba(20,20,20,.08)}
html[data-theme=dark] .mast a,html[data-theme=dark] .mast button{background:rgba(255,212,0,.12)}
.mast a.on{background:var(--syung-ink);color:var(--syung)}
html[data-theme=dark] .mast a.on{background:var(--syung);color:var(--syung-ink)}
main{max-width:960px;margin:0 auto;padding:18px 16px 56px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
main>*{min-width:0}
.box{background:var(--paper);border-radius:20px;box-shadow:var(--shadow);padding:20px}
h2{margin:0 0 12px;font-family:var(--round);font-weight:400;font-size:19px;display:flex;align-items:center;gap:10px}
.note{margin:8px 0 0;font-size:12.5px;line-height:1.55;color:var(--muted)}
.login{background:var(--mid-soft);color:var(--mid);border-radius:14px;padding:12px 16px;font-weight:700;font-size:14px}
.login[hidden]{display:none}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stat{background:var(--paper);border-radius:18px;box-shadow:var(--shadow);padding:14px 16px}
.stat small{font-size:12px;font-weight:700;color:var(--muted)}
.stat b{display:block;margin-top:4px;font-family:var(--round);font-weight:400;font-size:26px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--secondary)}

.calls{display:grid;gap:12px}
.call{display:grid;gap:6px}
.call div{display:flex;align-items:baseline;gap:8px;font-size:14px}
.call div b{margin-left:auto;font-variant-numeric:tabular-nums}
.call small{color:var(--muted);font-size:12px}
.meter{height:8px;border-radius:4px;background:var(--control);overflow:hidden}
.meter i{display:block;height:100%;background:var(--good)}
.meter i.mid{background:var(--mid)}.meter i.bad{background:var(--bad)}

table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:700;padding:0 8px 8px;border-bottom:1.5px solid var(--rule)}
td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--rule)}
td.n,th.n{text-align:right}
.problems{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.problems li{background:var(--bad-soft);color:var(--bad);border-radius:12px;padding:10px 12px;font-size:13.5px;font-weight:700}
.problems li.fine{background:var(--good-soft);color:var(--good)}
.btn{height:34px;padding:0 14px;border:0;border-radius:999px;background:var(--control);color:var(--ink);font:inherit;font-size:13px;font-weight:700;cursor:pointer;margin-left:auto}
@media (max-width:720px){.stats{grid-template-columns:1fr 1fr 1fr;gap:8px}.stat{padding:12px}.stat b{font-size:19px}.box{padding:16px}}
@media (max-width:400px){.mast h1{font-size:19px}.mast a,.mast button{padding:7px 10px}}
</style>
</head>
<body>
<header class="mast"><div class="mast-in"><h1>슝 서버 상태</h1><span class="sp"></span><nav aria-label="관리 화면"><a href="/admin/learning">학습</a><a href="/admin/debug">디버깅</a><a href="/admin/members">회원</a><a class="on" href="/admin/status" aria-current="page">서버 상태</a><form method="post" action="/api/logout" style="margin:0"><button type="submit">로그아웃</button></form></nav></div></header>
<main>
  <p class="login" id="login" hidden>로그인이 풀렸어요. <a href="/admin/login.html?next=/admin/status">다시 로그인</a></p>

  <section class="stats" aria-label="서버">
    <div class="stat"><small>켠 지</small><b id="uptime">–</b><span id="started"></span></div>
    <div class="stat"><small>지금 문제</small><b id="problemCount">–</b><span>이상 감지 기준</span></div>
    <div class="stat"><small>확인한 때</small><b id="checked">–</b><span>30초마다 다시 봐요</span></div>
  </section>

  <section class="box" aria-label="지금 문제">
    <h2>지금 문제<button class="btn" type="button" id="reload">다시 보기</button></h2>
    <ul class="problems" id="problems"><li class="fine">불러오는 중</li></ul>
  </section>

  <section class="box" aria-label="API 사용량">
    <h2>오늘 바깥 API 호출</h2>
    <div class="calls" id="calls"></div>
    <p class="note">서울시 API 는 키마다 하루 한도가 있어요(한국 날짜로 0시에 다시 세요). 위치 피드는 지하철 호출 안에서 따로 정한 예산이에요.</p>
  </section>

  <section class="box" aria-label="캐시">
    <h2>캐시</h2>
    <table><thead><tr><th>무엇</th><th class="n">담긴 수</th><th class="n">받은 지</th></tr></thead><tbody id="caches"></tbody></table>
  </section>
</main>
<script type="module" src="./status.mjs"></script>   <!-- 화면은 admin/status.tsx(Preact) — 빌드가 status.mjs 로 낸다 -->
</body>
</html>
