<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>슝 로그인</title>
<link rel="icon" href="./brand/favicon.ico" sizes="48x48">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<script>(()=>{let c='auto';try{c=localStorage.getItem('subway-theme')||'auto'}catch{}document.documentElement.dataset.theme=c==='dark'||(c==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'})();</script>
<style>
:root{--syung:#ffd400;--syung-ink:#141414;--board:#fbfaf4;--paper:#fffdf6;--ink:#1d1f21;--muted:#7d796a;--rule:#ece6cf;--bad:#c0392b;
  --shadow:0 3px 0 rgba(20,20,20,.06),0 6px 18px rgba(60,50,0,.08);--round:"Jua","Noto Sans KR",sans-serif}
html[data-theme=dark]{--board:#131416;--paper:#1a1c1f;--ink:#f1efe6;--muted:#8f8b7d;--rule:#2b2d30;--bad:#ff7b6b;--shadow:0 6px 18px rgba(0,0,0,.4)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--board);color:var(--ink);font-family:"Noto Sans KR","Apple SD Gothic Neo",sans-serif}
body{display:grid;place-items:center;min-height:100vh;padding:16px}
form{width:min(360px,100%);background:var(--paper);border-radius:22px;box-shadow:var(--shadow);padding:28px 24px;display:grid;gap:14px}
.logo{width:52px;height:52px;border-radius:14px;background:var(--syung);display:grid;place-items:center;font-family:var(--round);font-size:28px;color:var(--syung-ink)}
h1{margin:0;font-family:var(--round);font-weight:400;font-size:24px}
p{margin:0;color:var(--muted);font-size:14px}
label{display:grid;gap:6px;font-size:13px;font-weight:700}
input{height:46px;border:1.5px solid var(--rule);border-radius:12px;padding:0 14px;background:var(--board);color:var(--ink);font:inherit;font-size:16px}
input:focus{outline:none;border-color:var(--syung)}
button{height:48px;border:0;border-radius:999px;background:var(--syung);color:var(--syung-ink);font-family:var(--round);font-size:18px;cursor:pointer}
.err{color:var(--bad);font-weight:700;font-size:13px;min-height:1em}
a{color:var(--muted);font-size:13px;text-align:center}
</style>
</head>
<body>
<form method="post" action="/api/login">
  <div class="logo" aria-hidden="true">슝</div>
  <h1>관리자 로그인</h1>
  <p>한 번 로그인하면 이 기기에서 30일 동안 유지돼요.</p>
  <label>아이디<input name="user" autocomplete="username" required autofocus></label>
  <label>비밀번호<input name="password" type="password" autocomplete="current-password" required></label>
  <input type="hidden" name="next" id="next" value="/learning">
  <div class="err" id="err" role="alert"></div>
  <button type="submit">로그인</button>
  <a href="./">지도로 돌아가기</a>
</form>
<script>
const q=new URLSearchParams(location.search);
if(q.get('next'))document.getElementById('next').value=q.get('next');
document.getElementById('err').textContent=q.get('e')==='wait'?'로그인 시도가 너무 많아요. 10분 뒤에 다시 해 주세요.':q.get('e')?'아이디나 비밀번호가 맞지 않아요.':'';
</script>
</body>
</html>
