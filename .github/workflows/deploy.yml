name: test-and-deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 줄 세우기: main(push · 손으로 돌리기)은 한 줄 'deploy' 에서 차례로, PR 시험은 PR 마다 따로('ci-<ref>').
# 한 줄을 같이 쓰면 대기 중인 실행은 하나만 남아 PR 시험이 들어올 때 기다리던 main 배포가 취소된다(2026-10-28 #65 · #66)
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || 'deploy' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # 서버와 같은 버전
      # 서버 검사(pyproject.toml): ruff 린트 · pyright 타입 검사 — 도구만 설치(서버는 표준 라이브러리만). pip 25.1+ 가 --group 을 안다
      - run: python3 -m pip install --upgrade pip && python3 -m pip install --group dev
      - run: ruff check
      - run: pyright
      - run: node --test tests/*.test.mjs
      - run: python3 -m unittest discover -s tests
      - run: python3 -m py_compile server/*.py pipeline/*.py deploy/*.py
      # 웹 빌드(web/ → dist/web)가 되는지 — PR 에도. 올리기는 아래 build 잡(main 만)
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  # main: 웹을 빌드해 web-dist 브랜치에 커밋으로 쌓는다(트리 web/ = dist/web, 메시지 "web-dist <소스 커밋>").
  #   서버(deploy/deploy.sh)는 node 빌드 없이 이 커밋에서 web/ 을 꺼낸다. 앞 커밋을 부모로 이어 붙여 옛 커밋도 다시 배포할 수 있다
  build:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: deploy/publish_web_dist.sh

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy on the server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # the key is restricted server-side to deploy/remote_deploy.sh; the command here is ignored
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes "root@$HOST" deploy
