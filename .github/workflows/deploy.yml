name: test-and-deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 줄 세우기: main(push · 손으로 돌리기)은 한 줄 'deploy' 에서 차례로, PR 시험은 PR 마다 따로('ci-<ref>').
# 한 줄을 같이 쓰면 대기 중인 실행은 하나만 남아 PR 시험이 들어올 때 기다리던 main 배포가 취소된다(2026-10-28 #65 · #66)
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || 'deploy' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # main 은 바뀐 경로를 재려고 기록을 받는다(내용 없이 · 기록만이라 가볍다). PR 은 지금처럼 최신 하나만
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.ref != 'refs/heads/main' && 1 || 0 }}
          filter: ${{ github.ref == 'refs/heads/main' && 'blob:none' || '' }}
      # 시험을 통과해 빌드까지 끝난 마지막 커밋 — 여기서부터 바뀐 부분을 본다. 앞 배포가 실패 · 취소돼도 그 변경이 빠지지 않는다(못 찾으면 전부)
      - id: last-built
        if: github.ref == 'refs/heads/main'
        run: |
          git fetch --quiet --depth=1 origin refs/heads/web-dist || exit 0
          subject="$(git log -1 --format=%s FETCH_HEAD)"
          echo "sha=${subject#web-dist }" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/check
        with:
          base: ${{ steps.last-built.outputs.sha }}

  # main: 웹을 빌드해 web-dist 브랜치에 커밋으로 쌓는다(트리 web/ = dist/web, 메시지 "web-dist <소스 커밋>").
  #   서버(deploy/deploy.sh)는 node 빌드 없이 이 커밋에서 web/ 을 꺼낸다. 앞 커밋을 부모로 이어 붙여 옛 커밋도 다시 배포할 수 있다
  build:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: deploy/publish_web_dist.sh

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy on the server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # the key is restricted server-side to deploy/remote_deploy.sh; the command here is ignored
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes "root@$HOST" deploy
