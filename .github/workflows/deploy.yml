name: test-and-deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # 서버와 같은 버전
      # 서버 검사(pyproject.toml): ruff 린트 · pyright 타입 검사 — 도구만 설치(서버는 표준 라이브러리만). pip 25.1+ 가 --group 을 안다
      - run: python3 -m pip install --upgrade pip && python3 -m pip install --group dev
      - run: ruff check
      - run: pyright
      - run: node --test tests/*.test.mjs
      - run: python3 -m unittest discover -s tests
      - run: python3 -m py_compile server/*.py pipeline/*.py deploy/*.py

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy on the server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # the key is restricted server-side to deploy/remote_deploy.sh; the command here is ignored
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes "root@$HOST" deploy
